<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generated Static Page</title>
    <style>
        /* 这里写死你需要的暗黑/明亮模式和所有样式 */
        :root {
            --bg-primary: #FFFFFF;
            --text-primary: #111111;
            --brand-green: #06C755;
        }
        body.dark-theme {
            --bg-primary: #121212;
            --text-primary: #F5F5F7;
        }
        body {
            font-family: sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            margin: 0;
            transition: all 0.3s ease;
        }
        .header { padding: 20px 40px; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between;}
        .hero { padding: 100px 40px; text-align: center; }
        .hero h1 { font-size: 64px; margin-bottom: 20px;}
        .btn { background-color: var(--brand-green); color: white; padding: 15px 30px; border-radius: 30px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <header class="header">
        <div style="font-weight:bold; font-size: 20px; color: var(--brand-green);">LINE | Life on LINE | Communicate | Services | Downloads</div>
        <button id="theme-toggle">🌙 切换模式</button>
    </header>

    <section class="hero">
        <h1>LINE makes communication simple</h1>
        <p>这是完全静态的 HTML 页面，零数据请求，加载极快。</p>
        <br><br>
        <a href="#" class="btn">Download Now</a>
    </section>

    <script>
        const btn = document.getElementById('theme-toggle');
        btn.addEventListener('click', () => {
            document.body.classList.toggle('dark-theme');
            if(document.body.classList.contains('dark-theme')) {
                btn.textContent = '☀️ 明亮模式';
            } else {
                btn.textContent = '🌙 暗黑模式';
            }
        });
    </script>
</body>
</html>
